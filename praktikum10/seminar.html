<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="src/style/style.css" />

    <title>Registrasi Peserta</title>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <img
            src="src/image/logo_sttnf-removebg-preview.png"
            alt="Logo"
            width="30"
            height="24"
          />
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="seminar.html"
                >Registrasi Seminar</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="peserta.html"> Registrasi Peserta </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="data.html">Data Peserta</a>
            </li>
          </ul>

          <form class="d-flex">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Cari data..."
            />
            <button class="btn btn-outline-success" type="submit">
              Search
            </button>
          </form>
        </div>
      </div>
    </nav>

    <!-- Form -->
    <div class="container mt-5">
      <form>
        <!-- Kode -->
        <div class="row mb-3">
          <label for="kode" class="col-sm-3 col-form-label">Kode</label>
          <div class="col-sm-6">
            <input
              type="text"
              class="form-control"
              id="kode"
              placeholder="Masukkan kode"
            />
          </div>
        </div>

        <!-- Nama Kegiatan -->
        <div class="row mb-3">
          <label for="nama-kegiatan" class="col-sm-3 col-form-label">
            Nama Kegiatan
          </label>
          <div class="col-sm-6">
            <input
              type="text"
              class="form-control"
              id="nama-kegiatan"
              placeholder="Contoh: Jakarta"
            />
          </div>
        </div>

        <!-- Tanggal Mulai -->
        <div class="row mb-3">
          <label for="tanggal-mulai" class="col-sm-3 col-form-label">
            Tanggal Mulai
          </label>
          <div class="col-sm-3">
            <input type="date" class="form-control" id="tanggal-mulai" />
          </div>
        </div>

        <!-- Tanggal Akhir -->
        <div class="row mb-3">
          <label for="tanggal-akhir" class="col-sm-3 col-form-label">
            Tanggal Akhir
          </label>
          <div class="col-sm-3">
            <input type="date" class="form-control" id="tanggal-akhir" />
          </div>
        </div>

        <!-- Biaya -->
        <div class="row mb-3">
          <label for="biaya" class="col-sm-3 col-form-label">Biaya</label>
          <div class="col-sm-6">
            <input
              type="number"
              class="form-control"
              id="biaya"
              placeholder="Masukkan biaya"
              min="0"
            />
          </div>
        </div>

        <!-- Tempat -->
        <div class="row mb-3">
          <label for="tempat" class="col-sm-3 col-form-label">Tempat</label>
          <div class="col-sm-6">
            <input
              type="text"
              class="form-control"
              id="tempat"
              placeholder="Masukkan tempat"
            />
          </div>
        </div>

        <!-- Latitude -->
        <div class="row mb-3">
          <label for="latitude" class="col-sm-3 col-form-label">Latitude</label>
          <div class="col-sm-6">
            <input
              type="text"
              class="form-control"
              id="latitude"
              placeholder="Masukkan latitude"
            />
          </div>
        </div>

        <!-- Longitude -->
        <div class="row mb-3">
          <label for="longitude" class="col-sm-3 col-form-label"
            >Longitude</label
          >
          <div class="col-sm-6">
            <input
              type="text"
              class="form-control"
              id="longitude"
              placeholder="Masukkan longitude"
            />
          </div>
        </div>

        <!-- Jenis Kegiatan -->
        <div class="row mb-4">
          <label class="col-sm-3 col-form-label"> Jenis Kegiatan </label>
          <div class="col-sm-4">
            <select class="form-select">
              <option selected disabled>Pilih jenis Kegiatan</option>
              <option value="mahasiswa">Workshop</option>
              <option value="dosen">Seminar</option>
              <option value="umum">Kelas</option>
            </select>
          </div>
        </div>

        <!-- PIC -->
        <div class="row mb-3">
          <label for="pic" class="col-sm-3 col-form-label">PIC</label>
          <div class="col-sm-6">
            <input
              type="text"
              class="form-control"
              id="pic"
              placeholder="Masukkan PIC"
            />
          </div>
        </div>

        <!-- Deskripsi -->
        <div class="row mb-3">
          <label for="deskripsi" class="col-sm-3 col-form-label"
            >Deskripsi</label
          >
          <div class="col-sm-6">
            <textarea class="form-control" id="deskripsi" rows="3"></textarea>
          </div>
        </div>

        <!-- Button -->
        <div class="row">
          <div class="col-sm-3"></div>
          <div class="col-sm-6">
            <button type="submit" class="btn btn-primary">Simpan</button>
          </div>
        </div>
      </form>
    </div>

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
