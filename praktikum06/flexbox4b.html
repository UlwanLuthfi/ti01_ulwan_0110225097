<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/css/style4b.css" />
    <title>Flexbox 4B</title>
  </head>
  <body>
    <div class="container">
      <header class="box header">Header</header>
      <div class="box main">
        <aside class="box aside">Aside</aside>
        <div class="box content">
          <article class="box article">Article</article>
          <div class="box image">
            <img src="assets/img/apel.png" alt="apel" />
            <img src="assets/img/durian.png" alt="durian" />
            <img src="assets/img/jeruk.png" alt="jeruk" />
          </div>
        </div>
      </div>
      <footer class="box footer">Footer</footer>
    </div>
  </body>
</html>
